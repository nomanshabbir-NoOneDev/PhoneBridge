<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="PhoneBridge: your SIM cards on any device">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="0.55" stop-color="#14245a"/><stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#60a5fa" stop-opacity=".55"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/></radialGradient>
    <clipPath id="round"><rect width="1200" height="420" rx="28"/></clipPath>
  </defs>
  <style>
    .t1{font:800 64px/1 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#fff;letter-spacing:-2px}
    .t2{font:500 26px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#bfdbfe}
    .t3{font:600 18px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#93c5fd;letter-spacing:3px}
    .line{fill:none;stroke:url(#beam);stroke-width:4;stroke-linecap:round;stroke-dasharray:2 16;animation:flow 1.2s linear infinite}
    .wave{fill:none;stroke:#38bdf8;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite;opacity:0}
    .w2{animation-delay:.8s}.w3{animation-delay:1.6s}
    .float{animation:bob 5s ease-in-out infinite}.float2{animation:bob 5s ease-in-out -2.5s infinite}
    .orb{animation:drift 14s ease-in-out infinite}
    .tick{animation:blink 2.4s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-36}}
    @keyframes ping{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-20px)}}
    @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#round)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <circle class="orb" cx="980" cy="60" r="220" fill="url(#glow)"/>
    <circle class="orb" cx="120" cy="380" r="180" fill="url(#glow)" style="animation-delay:-6s"/>
    <text class="t3" x="70" y="118">YOUR SIM CARDS · ANY DEVICE</text>
    <text class="t1" x="66" y="205">PhoneBridge</text>
    <text class="t2" x="70" y="258">Calls, texts and USSD from your</text>
    <text class="t2" x="70" y="294">other phone, iPhone or laptop.</text>
    <g transform="translate(70,332)">
      <rect width="168" height="40" rx="20" fill="#2563eb"/><text x="84" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700" font-size="16" fill="#fff">Android 14+</text>
      <rect x="182" width="120" height="40" rx="20" fill="#ffffff" fill-opacity=".14"/><text x="242" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700" font-size="16" fill="#fff">iPhone</text>
      <rect x="316" width="130" height="40" rx="20" fill="#ffffff" fill-opacity=".14"/><text x="381" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700" font-size="16" fill="#fff">Browser</text>
    </g>
    <!-- donor phone: holds the SIM -->
    <g transform="translate(600,120)"><g class="float">
      <rect width="110" height="220" rx="20" fill="url(#phone)" stroke="#475569" stroke-width="3"/>
      <rect x="9" y="16" width="92" height="188" rx="12" fill="#0b1020"/>
      <g transform="translate(33,50)">
        <path d="M0 0H26L44 18V58H0Z" fill="#0f172a" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>
        <rect x="11" y="24" width="22" height="22" rx="4" fill="#38bdf8" opacity=".9"/>
        <path d="M11 35H33M22 24V46" stroke="#0b1020" stroke-width="2"/>
      </g>
      <text x="55" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700" font-size="14" fill="#e2e8f0">DONOR</text>
      <text x="55" y="170" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">holds the SIMs</text>
    </g></g>
    <!-- beams from the donor to each device -->
    <path class="line" d="M710 205 C 760 205, 795 182, 830 180"/>
    <path class="line" d="M710 195 C 800 110, 910 100, 955 148" style="animation-delay:-.4s"/>
    <path class="line" d="M710 185 C 820 50, 1060 50, 1098 255" style="animation-delay:-.8s"/>
    <!-- Android companion: rings -->
    <g transform="translate(790,180)"><g class="float">
      <circle class="wave" cx="40" cy="80" r="46"/><circle class="wave w2" cx="40" cy="80" r="46"/><circle class="wave w3" cx="40" cy="80" r="46"/>
      <rect width="80" height="160" rx="16" fill="url(#phone)" stroke="#475569" stroke-width="3"/>
      <rect x="7" y="13" width="66" height="134" rx="9" fill="#0b1020"/>
      <circle cx="40" cy="62" r="18" fill="#22c55e"/>
      <path d="M33 68c4 6 10 9 16 9l3-4-6-3-3 3c-3-1-6-4-7-7l3-3-3-6-4 3c0 3 0 7 1 8z" fill="#fff" class="tick"/>
      <text x="40" y="104" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700" font-size="10" fill="#e2e8f0">INCOMING…</text>
      <text x="40" y="119" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#94a3b8">rings here</text>
    </g></g>
    <text x="830" y="368" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="600" font-size="12" letter-spacing="2" fill="#93c5fd">ANDROID</text>
    <!-- iPad -->
    <g transform="translate(895,150)"><g class="float2">
      <rect width="120" height="190" rx="14" fill="url(#phone)" stroke="#475569" stroke-width="3"/>
      <rect x="8" y="10" width="104" height="170" rx="7" fill="#0b1020"/>
      <rect x="18" y="26" width="64" height="20" rx="8" fill="#a78bfa" opacity=".9" class="tick"/>
      <rect x="38" y="56" width="64" height="20" rx="8" fill="#334155"/>
      <rect x="18" y="86" width="52" height="20" rx="8" fill="#a78bfa" opacity=".6"/>
      <rect x="18" y="146" width="84" height="22" rx="11" fill="#1e293b" stroke="#475569"/>
      <circle cx="60" cy="161" r="3" fill="#475569"/>
    </g></g>
    <text x="955" y="368" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="600" font-size="12" letter-spacing="2" fill="#93c5fd">IPAD</text>
    <!-- laptop -->
    <g transform="translate(1030,258) scale(.8)"><g class="float">
      <rect x="10" y="0" width="150" height="96" rx="8" fill="url(#phone)" stroke="#475569" stroke-width="3"/>
      <rect x="18" y="8" width="134" height="80" rx="4" fill="#0b1020"/>
      <rect x="28" y="20" width="60" height="8" rx="4" fill="#38bdf8" opacity=".8"/>
      <rect x="28" y="36" width="96" height="6" rx="3" fill="#334155"/>
      <rect x="28" y="48" width="80" height="6" rx="3" fill="#334155"/>
      <circle cx="128" cy="68" r="9" fill="#22c55e" class="tick"/>
      <rect x="0" y="99" width="170" height="9" rx="4.5" fill="#334155"/>
    </g></g>
    <text x="1098" y="368" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="600" font-size="12" letter-spacing="2" fill="#93c5fd">LAPTOP</text>
  </g>
</svg>
